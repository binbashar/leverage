name: Tests | Integration

on:
  pull_request:
  workflow_dispatch:
  # Called by the release workflow, to test the very package it is about to publish
  workflow_call:
    inputs:
      dist-artifact:
        description: Name of an artifact holding the built distributables. When given, the wheel in it is tested instead of the checkout.
        type: string
        default: ""
      expected-version:
        description: Version the installed cli must report. Only checked when dist-artifact is given.
        type: string
        default: ""
    # Used by the ref-arch test
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_DEVSTG_ACCOUNT_ID:
        required: true
      AWS_SECURITY_ACCOUNT_ID:
        required: true

permissions:
  contents: read

jobs:
  # The first entry is the required check, so its name must stay exactly `integration_tests`.
  # The others check compatibility: older and newer tofu/terraform releases, and macOS, which most
  # of the team uses (BSD userland, /var -> /private/var symlinks). Public repo: standard runners
  # cost nothing, but macOS ones are slower and capped at 5 concurrent jobs across the org.
  integration_tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: integration_tests
            os: ubuntu-latest
            opentofu: 1.13.2
            terraform: 1.9.8
          - name: integration_tests_compat (ubuntu, older tofu and terraform)
            os: ubuntu-latest
            opentofu: 1.10.10
            terraform: 1.12.2
          - name: integration_tests_compat (ubuntu, latest tofu and terraform)
            os: ubuntu-latest
            opentofu: 1.13.9
            terraform: 1.17.2
          - name: integration_tests_compat (macos, latest tofu and terraform)
            os: macos-latest
            opentofu: 1.13.9
            terraform: 1.17.2
    env:
      TERRAFORM_VERSION: ${{ matrix.terraform }}
      OPENTOFU_VERSION: ${{ matrix.opentofu }}
      BATS_LIB_PATH: /usr/local/lib/bats
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # The bats tests drive the installed command
      - uses: ./.github/actions/install-leverage
        with:
          dist-artifact: ${{ inputs.dist-artifact }}
          expected-version: ${{ inputs.expected-version }}

      - name: Install bats
        run: |
          echo "[INFO] Installing bats and its libraries"
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local
          sudo mkdir -p "${BATS_LIB_PATH}"
          sudo git clone --depth 1 https://github.com/bats-core/bats-support.git "${BATS_LIB_PATH}/bats-support"
          sudo git clone --depth 1 https://github.com/bats-core/bats-assert.git "${BATS_LIB_PATH}/bats-assert"

      - name: Install terraform and tofu
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            arm64|aarch64) arch=arm64 ;;
            *) echo "[ERROR] Unsupported architecture $(uname -m)"; exit 1 ;;
          esac
          echo "[INFO] Installing terraform ${TERRAFORM_VERSION} and tofu ${OPENTOFU_VERSION} for ${os}_${arch}"
          curl -fsSL -o /tmp/terraform.zip \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_${os}_${arch}.zip"
          curl -fsSL -o /tmp/tofu.zip \
            "https://github.com/opentofu/opentofu/releases/download/v${OPENTOFU_VERSION}/tofu_${OPENTOFU_VERSION}_${os}_${arch}.zip"
          sudo unzip -q -o /tmp/terraform.zip terraform -d /usr/local/bin
          sudo unzip -q -o /tmp/tofu.zip tofu -d /usr/local/bin
          terraform version
          tofu version

      - name: run_integration_tests
        run: |
          echo "[INFO] Running integration tests"
          make test-int
        shell: bash

  # The ref-arch test applies real infrastructure in AWS, so on pull requests it only runs when it
  # can test something: the cli, or the way it is installed, changed and the AWS credentials are
  # available (they are not to pull requests from forks, nor to Dependabot's).
  # It always runs when dispatched by hand or called by the release workflow.
  # This is decided in a job, rather than with `paths` under `on:`, so the workflow always runs and
  # integration_tests, a required check, never stays pending.
  refarch_changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Decide whether to run the ref-arch test
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HAS_AWS_CREDENTIALS: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        run: |
          set -euo pipefail
          run=true
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            if [[ "${HEAD_REPO}" != "${REPO}" ]]; then
              echo "::notice::Skipping the ref-arch test: pull requests from forks have no access to the AWS credentials"
              run=false
            elif [[ "${HAS_AWS_CREDENTIALS}" != "true" ]]; then
              echo "::notice::Skipping the ref-arch test: no AWS credentials available to this run"
              run=false
            else
              changed_files="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" --jq '.[].filename')"
              relevant='^(leverage/|pyproject\.toml$|poetry\.lock$|\.github/workflows/tests-integration\.yaml$|\.github/actions/)'
              if ! grep -qE "${relevant}" <<< "${changed_files}"; then
                echo "::notice::Skipping the ref-arch test: no changes to the cli nor to how it is installed"
                run=false
              fi
            fi
          fi
          echo "[INFO] Run the ref-arch test: ${run}"
          echo "run=${run}" >> "${GITHUB_OUTPUT}"

  # Tests the cli end to end against the reference architecture: creates a project, then applies
  # and destroys a layer of le-tf-infra-aws in the apps-devstg account.
  integration_tests_cli_refarch:
    needs: refarch_changes
    if: needs.refarch_changes.outputs.run == 'true'
    # Python 3.9 is not available on Ubuntu 26.04, which ubuntu-latest points to since 2026-11.
    # Move back to ubuntu-latest once 3.9 support is dropped.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Every run applies and destroys the same layer, with the same resource names, in the same
    # account, so no two of them may overlap: neither the jobs of one run (max-parallel below) nor
    # those of different runs (pull requests, manual and release runs). A run never cancels
    # another's round trip, which would leave its resources behind. GitHub keeps only one job
    # pending per group, so a third one arriving cancels the pending one, which can be re-run.
    concurrency:
      group: refarch-cli-test-layer
      cancel-in-progress: false
    env:
      # The version the reference architecture runs
      OPENTOFU_VERSION: 1.13.2
      LEVERAGE_INTERACTIVE: 0
    defaults:
      run:
        shell: bash
    strategy:
      # Every job applies and destroys the same layer in the same account, so they must not overlap
      max-parallel: 1
      matrix:
        # The oldest and newest supported versions; the unit tests cover every one of them
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: ./.github/actions/install-leverage
        with:
          dist-artifact: ${{ inputs.dist-artifact }}
          expected-version: ${{ inputs.expected-version }}

      # Without the wrapper, so tofu exit codes and output reach the cli untouched
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}
          tofu_wrapper: false

      - name: Project Init
        run: |
          set -euo pipefail
          mkdir -p ../theadamproject
          cd ../theadamproject
          leverage project init
          [[ -f project.yaml ]] || { echo "::error::project init did not create project.yaml"; exit 1; }

      - name: Set project file and create
        working-directory: ../theadamproject
        run: |
          set -euo pipefail
          sed -i 's/<project name>/the-adam-project/' project.yaml
          sed -i 's/<short project name>/bb/' project.yaml
          sed -i 's/<management email address>/bb@domainmgmt/' project.yaml
          sed -i 's/<security email address>/bb@domainsec/' project.yaml
          sed -i 's/<shared email address>/bb@domainshared/' project.yaml
          sed -i 's/<user.name>/bbuser/' project.yaml
          leverage project create
          for account in config management security shared; do
            [[ -d "${account}" ]] || { echo "::error::project create did not create ${account}"; exit 1; }
          done

      - name: Set up credentials
        env:
          DEPLOYMASTER_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          DEPLOYMASTER_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DEVSTG_ACCOUNT_ID: ${{ secrets.AWS_DEVSTG_ACCOUNT_ID }}
          SECURITY_ACCOUNT_ID: ${{ secrets.AWS_SECURITY_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          aws configure set aws_access_key_id "${DEPLOYMASTER_ACCESS_KEY_ID}" --profile bb-deploymaster
          aws configure set aws_secret_access_key "${DEPLOYMASTER_SECRET_ACCESS_KEY}" --profile bb-deploymaster
          aws configure set region us-east-1 --profile bb-apps-devstg-devops
          aws configure set output json --profile bb-apps-devstg-devops
          aws configure set role_arn "arn:aws:iam::${DEVSTG_ACCOUNT_ID}:role/DeployMaster" --profile bb-apps-devstg-devops
          aws configure set source_profile bb-deploymaster --profile bb-apps-devstg-devops
          aws configure set region us-east-1 --profile bb-security-oaar
          aws configure set output json --profile bb-security-oaar
          aws configure set role_arn "arn:aws:iam::${SECURITY_ACCOUNT_ID}:role/DeployMaster" --profile bb-security-oaar
          aws configure set source_profile bb-deploymaster --profile bb-security-oaar
          # The cli reads the credentials of project bb from ~/.aws/bb
          mkdir -p ~/.aws/bb
          cp ~/.aws/credentials ~/.aws/config ~/.aws/bb/

      - name: Configure Reference Architecture
        working-directory: ../theadamproject
        env:
          SECURITY_ACCOUNT_ID: ${{ secrets.AWS_SECURITY_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          cat << EOF > ./config/common.tfvars
          project = "bb"
          project_long = "binbash"
          region_primary = "us-east-1"
          region_secondary = "us-east-2"
          vault_address = "vault_trash"
          vault_token = "vault_trash"
          sso_region = "us-east-1"
          sso_enabled = false
          sso_start_url = "sso_trash"

          accounts = {
            security = {
              id = ${SECURITY_ACCOUNT_ID}
            }
          }
          EOF
          sed -i "s/^\(MFA_ENABLED=\)true/\1false/" build.env

      - name: Test tofu
        working-directory: ../theadamproject/security/us-east-1/base-tf-backend
        run: leverage tofu init --skip-validation

      - name: Test AWS
        working-directory: ../theadamproject/security/us-east-1/base-tf-backend
        env:
          DEVSTG_ACCOUNT_ID: ${{ secrets.AWS_DEVSTG_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          account="$(leverage aws sts get-caller-identity --profile bb-apps-devstg-devops --query Account --output text)"
          [[ "${account}" == "${DEVSTG_ACCOUNT_ID}" ]] || { echo "::error::the profile did not assume a role in the apps-devstg account"; exit 1; }

      - name: Clone Testing Reference Architecture repo
        run: git clone --depth 1 https://github.com/binbashar/le-tf-infra-aws.git ../theblairwitchproject

      - name: Configure Testing Reference Architecture
        working-directory: ../theblairwitchproject
        env:
          SECURITY_ACCOUNT_ID: ${{ secrets.AWS_SECURITY_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          cat << EOF > ./config/common.tfvars
          project = "bb"
          project_long = "binbash"
          region_primary = "us-east-1"
          region_secondary = "us-east-2"
          vault_address = "vault_trash"
          vault_token = "vault_trash"
          sso_region = "us-east-1"
          sso_enabled = false
          sso_start_url = "sso_trash"

          accounts = {
            security = {
              id = ${SECURITY_ACCOUNT_ID}
            }
          }
          EOF
          sed -i "s/^\(MFA_ENABLED=\)true/\1false/" build.env

      # The reference architecture keeps cli-test-layer unprovisioned (its `provisioned` variable
      # defaults to false), so every command below passes -var=provisioned=true: the test creates
      # the layer's resources and destroys them within this run.
      - name: Init the ref-arch layers
        working-directory: ../theblairwitchproject/apps-devstg/global
        run: leverage tofu init --layers cli-test-layer,base-identities

      # Only an empty layer may be applied and destroyed. Resources that already exist belong to
      # someone else, e.g. a /tofu apply test in le-tf-infra-aws, and must not be destroyed.
      - name: Check the test layer is empty
        id: layer_empty
        working-directory: ../theblairwitchproject/apps-devstg/global
        run: |
          set -euo pipefail
          rc=0; leverage tofu plan -detailed-exitcode -var=provisioned=true --layers cli-test-layer || rc=$?
          if [[ ${rc} -eq 0 ]]; then
            echo "::error::cli-test-layer already has its resources (provisioned by le-tf-infra-aws, or left over by a failed run), refusing to apply and destroy it"
            exit 1
          fi
          [[ ${rc} -eq 2 ]] || { echo "::error::plan failed (rc=${rc})"; exit 1; }

      - name: Apply the test layer
        working-directory: ../theblairwitchproject/apps-devstg/global
        run: leverage tofu apply -auto-approve -var=provisioned=true --layers cli-test-layer

      - name: Check the apply converged
        working-directory: ../theblairwitchproject/apps-devstg/global
        run: |
          set -euo pipefail
          rc=0; leverage tofu plan -detailed-exitcode -var=provisioned=true --layers cli-test-layer || rc=$?
          [[ ${rc} -eq 0 ]] || { echo "::error::post-apply plan not empty (rc=${rc})"; exit 1; }

      # Cleans up whatever this run created, even if a previous step failed or the run was cancelled.
      # Never runs when the layer was not empty, so it only destroys what this run created.
      - name: Destroy the test layer
        if: always() && steps.layer_empty.outcome == 'success'
        working-directory: ../theblairwitchproject/apps-devstg/global
        run: leverage tofu destroy -auto-approve -var=provisioned=true --layers cli-test-layer
