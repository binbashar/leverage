name: Release | PyPi Build Test Package and Push

on:
  workflow_dispatch:
    inputs:
      version:
        description: |
          "Version to publish (optional):
          If not given, next patch from latest will be used."
        default: ""
        required: false

# Read-only GITHUB_TOKEN: the job only checks out and uploads to PyPI with PYPI_TOKEN
permissions:
  contents: read

jobs:
  build_push:
    runs-on: ubuntu-latest 
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: |
          echo "[INFO] Installing Poetry..."
          curl -sSL https://install.python-poetry.org | POETRY_VERSION=1.8.2 python -
          echo "[INFO] Configuring Poetry..."
          poetry config virtualenvs.create false  # This prevents poetry from creating a virtual environment

      - name: Install dependencies using Poetry
        run: |
          echo "[INFO] Installing dependencies..."
          export ENV POETRY_VIRTUALENVS_CREATE=false
          export PATH="${PATH}:${HOME}/.poetry/bin"
          poetry install --with=dev

      - name: bump_test_version
        # The input goes through an env var, not ${{ }} in the script, so it can't inject shell code
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "No version input provided, running without RELEASE_VERSION."
            make bump-test-version
          else
            echo "Version input provided: $VERSION"
            make bump-test-version RELEASE_VERSION="$VERSION"
          fi
        shell: bash

      - name: clean
        run: |
          make clean

      - name: build
        run: |
          make build

      - name: check
        run:
          make check

      - name: upload
        run: |
          make push-ci
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
