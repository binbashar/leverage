name: Tests | Unit

on:
  push:
  pull_request:
  # Called by the release workflow, to gate the publication on the tagged commit
  workflow_call:

permissions:
  contents: read

jobs:
  unit_tests:
    # Python 3.9 is not available on Ubuntu 26.04, which ubuntu-latest points to since 2026-11.
    # Move back to ubuntu-latest once 3.9 support is dropped.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          echo "[INFO] Installing Poetry..."
          curl -sSL https://install.python-poetry.org | POETRY_VERSION=1.8.2 python -
          echo "[INFO] Configuring Poetry..."
          poetry config virtualenvs.create false  # This prevents poetry from creating a virtual environment

      - name: Install dependencies using Poetry
        run: |
          echo "[INFO] Installing dependencies..."
          export ENV POETRY_VIRTUALENVS_CREATE=false
          export PATH="${PATH}:${HOME}/.poetry/bin"
          poetry install --with=dev

      - name: Run unit tests
        run: |
          echo "[INFO] Running unit tests and generate coverage report"
          export PATH="${PATH}:${HOME}/.poetry/bin"
          poetry run pytest --verbose --cov=./leverage/ --cov-report=xml
        shell: bash

      - name: Report Coveralls
        # Run this for the last python version only, and not when gating a release
        if: matrix.python-version == '3.13' && github.event_name != 'release'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
