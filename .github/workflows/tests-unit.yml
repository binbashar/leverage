name: Tests | Unit

on:
  push:
  pull_request:
  # Called by the release workflow, to gate the publication on the tagged commit
  workflow_call:

permissions:
  contents: read

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          echo "[INFO] Installing Poetry..."
          curl -sSL https://install.python-poetry.org | POETRY_VERSION=1.8.2 python -
          echo "[INFO] Configuring Poetry..."
          poetry config virtualenvs.create false  # This prevents poetry from creating a virtual environment

      - name: Install dependencies using Poetry
        run: |
          echo "[INFO] Installing dependencies..."
          export ENV POETRY_VIRTUALENVS_CREATE=false
          export PATH="${PATH}:${HOME}/.poetry/bin"
          poetry install --with=dev

      # Needs the dependencies installed, so it runs here and not in the lint job. Config in [tool.mypy]
      # in pyproject.toml; it checks for Python 3.11 whatever the runtime, so once is enough.
      - name: Type check (mypy)
        if: matrix.python-version == '3.13'
        run: poetry run mypy

      - name: Run unit tests
        run: |
          echo "[INFO] Running unit tests and generate coverage report"
          export PATH="${PATH}:${HOME}/.poetry/bin"
          poetry run pytest --verbose --cov=./leverage/ --cov-report=xml
        shell: bash

      - name: Report Coveralls
        # Run this for the last python version only, and not when gating a release
        if: matrix.python-version == '3.13' && github.event_name != 'release'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # The contract tests with the reference architecture (tests/test_refarch_contract.py) run in
  # unit_tests on a snapshot of a few ref-arch layers. Here they run on every layer of the current
  # le-tf-infra-aws, so a change there that breaks the cli shows up too. No AWS involved.
  # Not a required check, and skipped when gating a release (the snapshot tests in unit_tests still
  # run there): le-tf-infra-aws can change without this repo changing.
  contract_tests_refarch:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | POETRY_VERSION=1.8.2 python -
          poetry config virtualenvs.create false

      - name: Install dependencies using Poetry
        run: poetry install --with=dev

      - name: Clone the reference architecture
        run: |
          git clone --depth 1 https://github.com/binbashar/le-tf-infra-aws.git "${RUNNER_TEMP}/le-tf-infra-aws"
          echo "[INFO] le-tf-infra-aws at $(git -C "${RUNNER_TEMP}/le-tf-infra-aws" rev-parse --short HEAD)"

      - name: Run the contract tests on every ref-arch layer
        run: |
          export LEVERAGE_REFARCH_DIR="${RUNNER_TEMP}/le-tf-infra-aws"
          poetry run pytest --verbose --no-cov tests/test_refarch_contract.py
