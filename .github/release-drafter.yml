name-template: 'v$RESOLVED_VERSION 🌈'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '💣 Breaking Change'
    labels:
      - 'breakingchange'
      - 'breaking'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: '📝 Documentation'
    labels:
      - 'doc'
      - 'documentation'
  - title: '🔨 Maintenance'
    labels:
      - 'chore'
      - 'maintenance'
# Labels PRs from their title, e.g. "Fix | ...", "fix: ...", "Enhancement | ...", "feat(cli): ...".
# Runs on pull_request events (see release-management-github.yml); it only adds labels.
autolabeler:
  - label: 'fix'
    title:
      - '/^\s*(fix|bug|bugfix|hotfix)\b/i'
  - label: 'enhancement'
    title:
      - '/^\s*(feat|feature|enhancement)\b/i'
  - label: 'documentation'
    title:
      - '/^\s*docs?\b/i'
  - label: 'minor'
    title:
      - '/^\s*(feat|feature|enhancement)\b/i'
  - label: 'patch'
    title:
      - '/^\s*(fix|bug|bugfix|hotfix|docs?|chore)\b/i'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&' # You can add # and @ to disable mentions, and add ` to disable code blocks.
# The next version is the highest bump among the merged PRs' labels: major, minor or patch.
# The autolabeler above sets a default from the PR title; change the label on the PR to override it.
version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking'
      - 'breakingchange'
  minor:
    labels:
      - 'minor'
  patch:
    labels:
      - 'patch'
  default: patch
footer: |
  ---  
  ⚠️ *REMINDER:* please remember to add or update the Version Compatibility section before publishing a release draft.
template: |
  ## Changes

  $CHANGES
